name: Build App

on:
  push:
    branches:
      - feature/reader-open-parse-render
  pull_request:
    branches:
      - feature/reader-open-parse-render
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing; downloading for Gradle 9.6.0"
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v9.6.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run Core Model contract tests
        run: ./gradlew :core:model:test --stacktrace --no-daemon

      - name: Run Core Database migration tests
        run: ./gradlew :core:database:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Core Data contract tests
        run: ./gradlew :core:data:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Format API unit tests
        run: ./gradlew :engine:format-api:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Layout Engine unit tests
        run: ./gradlew :engine:layout:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Render Engine unit tests
        run: ./gradlew :engine:render:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Reader Feature unit tests
        run: ./gradlew :feature:reader:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Reader Feature Android Lint
        run: ./gradlew :feature:reader:lintDebug --stacktrace --no-daemon

      - name: Run Markdown Engine unit tests
        run: ./gradlew :engine:format-markdown:testDebugUnitTest --stacktrace --no-daemon

      - name: Run EPUB Engine unit tests
        run: ./gradlew :engine:format-epub:testDebugUnitTest --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android SAF instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-saf-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble Debug
        if: always()
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
